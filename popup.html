<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLASS Enter の設定</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <h1>CLASS Enter</h1>
  <label><input type="checkbox" id="auto-enter" disabled> 入口を自動で進む</label>
  <p>オン：サイトを開くと自動で進みます。<br>オフ：Enter キーかボタンで進みます。</p>
  <p>変更後は CLASS のページを再読み込みしてください。</p>
  <p>出席登録は、どちらの設定でもコード入力後に Enter を押します。</p>
  <p id="status" role="status" aria-live="polite">設定を読み込み中…</p>
</body>
</html>
